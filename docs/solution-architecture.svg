<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980" role="img" aria-labelledby="title desc">
  <title id="title">Access Seat-Equivalent Allocation Evidence Architecture</title>
  <desc id="desc">Cloudflare Access access_requests logs are sent by Logpush to R2, processed by a scheduled Workflow into D1, enriched with app ownership from Resource Tagging or manual main-admin overrides, and exposed through an Access-protected viewer for Finance review and CSV export.</desc>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; fill: #1A1A1A; }
      .title { font-size: 30px; font-weight: 700; }
      .sub { fill: #6B7280; font-size: 14px; }
      .zone-title { font-size: 18px; font-weight: 700; fill: #1A6FD4; }
      .label { font-size: 16px; font-weight: 700; }
      .small { font-size: 13px; fill: #6B7280; }
      .zone { fill: #FFFFFF; stroke: #1A6FD4; stroke-width: 1.5; stroke-dasharray: 8 4; rx: 10; }
      .box { fill: #F5F7FA; stroke: #D1D9E0; stroke-width: 1.5; rx: 10; }
      .orange { fill: #FFF4E8; stroke: #F6821F; stroke-width: 1.6; rx: 10; }
      .greenbox { fill: #ECFDF3; stroke: #16A34A; stroke-width: 1.5; rx: 10; }
      .cf { fill: #F6821F; }
      .blue { fill: #1A6FD4; }
      .green { fill: #16A34A; }
      .line { fill: none; stroke: #F6821F; stroke-width: 2.2; marker-end: url(#arrow); }
      .blue-line { fill: none; stroke: #1A6FD4; stroke-width: 2.1; marker-end: url(#arrow-blue); }
      .green-line { fill: none; stroke: #16A34A; stroke-width: 2.1; marker-end: url(#arrow-green); }
      .dash { stroke-dasharray: 6 5; }
      .edge { font-size: 13px; fill: #6B7280; font-weight: 600; paint-order: stroke; stroke: #FFFFFF; stroke-width: 5px; stroke-linejoin: round; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#F6821F" /></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#1A6FD4" /></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#16A34A" /></marker>
  </defs>

  <rect width="1600" height="980" fill="#FFFFFF" />
  <text x="70" y="58" class="title">Cloudflare Access seat-equivalent allocation evidence</text>
  <text x="70" y="84" class="sub">Scheduled Workflow ingestion, R2 cursor batches, D1 allocation, manual ownership overrides, and Access-protected exports</text>

  <rect class="zone" x="55" y="125" width="275" height="660" />
  <text x="75" y="158" class="zone-title">Zero Trust data sources</text>
  <rect class="zone" x="360" y="125" width="360" height="660" />
  <text x="380" y="158" class="zone-title">Batch ingestion plane</text>
  <rect class="zone" x="750" y="125" width="365" height="660" />
  <text x="770" y="158" class="zone-title">D1 reporting database</text>
  <rect class="zone" x="1145" y="125" width="400" height="660" />
  <text x="1165" y="158" class="zone-title">Viewer, ownership, and exports</text>

  <rect class="box" x="85" y="205" width="215" height="92" />
  <circle class="cf" cx="122" cy="251" r="24" />
  <text x="160" y="243" class="label">Cloudflare Access</text>
  <text x="160" y="266" class="small">Successful app logins</text>

  <rect class="box" x="85" y="355" width="215" height="92" />
  <rect class="blue" x="110" y="380" width="38" height="38" rx="7" />
  <path d="M119 398h20M119 389h20M119 407h20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <text x="160" y="392" class="label">Logpush job</text>
  <text x="160" y="415" class="small">access_requests dataset</text>

  <rect class="box" x="85" y="525" width="215" height="118" />
  <path class="blue" d="M107 562c0-17 42-17 42 0v42c0 17-42 17-42 0z" />
  <ellipse cx="128" cy="562" rx="21" ry="8" fill="#FFFFFF" opacity="0.9" />
  <text x="160" y="560" class="label">R2 log bucket</text>
  <text x="160" y="583" class="small">customer R2 bucket</text>
  <text x="160" y="604" class="small">{DATE} folders = YYYYMMDD</text>
  <text x="160" y="625" class="small">Late files retained</text>

  <rect class="orange" x="390" y="195" width="300" height="120" />
  <rect class="cf" x="415" y="223" width="52" height="52" rx="12" />
  <path d="M428 249h26M441 236v26" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  <text x="485" y="235" class="label">Scheduled Workflow</text>
  <text x="485" y="258" class="small">02:00 UTC schedule</text>
  <text x="485" y="279" class="small">Manual trigger supported</text>

  <rect class="box" x="390" y="365" width="300" height="145" />
  <rect class="blue" x="415" y="398" width="52" height="52" rx="12" />
  <path d="M429 416h24M429 429h24M429 442h24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <text x="485" y="400" class="label">R2 listing batches</text>
  <text x="485" y="423" class="small">Prefix + limit + cursor</text>
  <text x="485" y="444" class="small">Uses truncated signal</text>
  <text x="485" y="465" class="small">Cursor state persisted in D1</text>

  <rect class="box" x="390" y="565" width="300" height="145" />
  <rect class="blue" x="415" y="596" width="52" height="52" rx="12" />
  <path d="M425 622l11 11 23-28" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="485" y="600" class="label">Retryable file steps</text>
  <text x="485" y="623" class="small">Decompress gzip logs</text>
  <text x="485" y="644" class="small">Filter Allowed login rows</text>
  <text x="485" y="665" class="small">Idempotent D1 upserts</text>

  <rect class="box" x="780" y="190" width="305" height="120" />
  <path class="blue" d="M808 226c0-20 70-20 70 0v46c0 20-70 20-70 0z" />
  <ellipse cx="843" cy="226" rx="35" ry="11" fill="#FFFFFF" opacity="0.9" />
  <text x="900" y="226" class="label">Ingestion state</text>
  <text x="900" y="249" class="small">processed_files</text>
  <text x="900" y="270" class="small">workflow_runs, run_state</text>

  <rect class="box" x="780" y="350" width="305" height="125" />
  <path class="blue" d="M808 390c0-20 70-20 70 0v46c0 20-70 20-70 0z" />
  <ellipse cx="843" cy="390" rx="35" ry="11" fill="#FFFFFF" opacity="0.9" />
  <text x="900" y="388" class="label">Usage model</text>
  <text x="900" y="411" class="small">access_events, users</text>
  <text x="900" y="432" class="small">usage by period/user/app</text>
  <text x="900" y="453" class="small">login_count and first/last seen</text>

  <rect class="greenbox" x="780" y="525" width="305" height="135" />
  <path class="green" d="M808 564c0-20 70-20 70 0v46c0 20-70 20-70 0z" />
  <ellipse cx="843" cy="564" rx="35" ry="11" fill="#FFFFFF" opacity="0.9" />
  <text x="900" y="562" class="label">App ownership</text>
  <text x="900" y="585" class="small">app_owner_snapshot</text>
  <text x="900" y="606" class="small">app_owner_override</text>
  <text x="900" y="627" class="small">manual_override source</text>

  <rect class="box" x="780" y="700" width="305" height="65" />
  <text x="805" y="731" class="label">Report context</text>
  <text x="805" y="753" class="small">report_exports and export files</text>

  <rect class="orange" x="1175" y="190" width="330" height="120" />
  <rect class="cf" x="1200" y="222" width="56" height="42" rx="8" />
  <path d="M1210 243h36" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  <text x="1275" y="224" class="label">Viewer Worker</text>
  <text x="1275" y="247" class="small">Access-protected app</text>
  <text x="1275" y="268" class="small">ADMIN_EMAILS viewer allowlist</text>
  <text x="1275" y="289" class="small">JWT identity from Access</text>

  <rect class="greenbox" x="1175" y="360" width="330" height="135" />
  <circle class="green" cx="1228" cy="410" r="25" />
  <path d="M1215 412l9 10 18-28" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="1275" y="391" class="label">Manual owner assignment</text>
  <text x="1275" y="414" class="small">Only MAIN_ADMIN_EMAILS can write</text>
  <text x="1275" y="435" class="small">POST /api/app-owner</text>
  <text x="1275" y="456" class="small">Updates override + snapshot</text>

  <rect class="box" x="1175" y="545" width="330" height="125" />
  <rect class="blue" x="1205" y="580" width="54" height="38" rx="8" />
  <rect class="blue" x="1268" y="580" width="54" height="38" rx="8" opacity="0.8" />
  <text x="1340" y="580" class="label">Finance review</text>
  <text x="1340" y="603" class="small">Team totals CSV</text>
  <text x="1340" y="624" class="small">Relationship CSV</text>
  <text x="1340" y="645" class="small">Runs and health APIs</text>

  <rect class="box" x="1175" y="710" width="330" height="65" />
  <text x="1200" y="740" class="label">Resource Tagging path</text>
  <text x="1200" y="762" class="small">Optional owner_team + cost_center sync</text>

  <path class="line" d="M192 297 L192 349" />
  <path class="line" d="M192 447 L192 519" />
  <path class="line" d="M300 585 L345 585 L345 438 L384 438" />
  <path class="line" d="M540 315 L540 359" />
  <path class="line" d="M540 510 L540 559" />
  <path class="line" d="M690 637 L730 637 L730 250 L774 250" />
  <path class="line" d="M730 415 L774 415" />
  <path class="line" d="M730 592 L774 592" />
  <path class="blue-line" d="M1085 412 L1124 412 L1124 250 L1169 250" />
  <path class="blue-line" d="M1175 268 L1136 268 L1136 430 L1091 430" />
  <path class="green-line" d="M1175 460 L1164 460 L1164 592 L1091 592" />
  <path class="green-line" d="M1175 735 L1136 735 L1136 640 L1091 640" />
  <path class="line" d="M1085 750 L1104 750 L1104 610 L1169 610" />

  <text x="230" y="335" class="edge">push logs</text>
  <text x="352" y="548" class="edge">R2 list / get</text>
  <text x="565" y="342" class="edge">scheduled run</text>
  <text x="560" y="538" class="edge">bounded steps</text>
  <text x="736" y="336" class="edge">upsert events</text>
  <text x="1132" y="336" class="edge">query reports</text>
  <text x="1095" y="422" class="edge">results</text>
  <text x="1170" y="530" class="edge">write override</text>
  <text x="1144" y="700" class="edge">owner sync</text>
  <text x="1088" y="770" class="edge">export files</text>

  <rect x="70" y="825" width="1460" height="72" rx="10" fill="#F5F7FA" stroke="#D1D9E0" />
  <text x="95" y="855" class="small">Key controls: group membership is not used for allocation. Finance receives evidence, not invoice truth. Manual owner writes are restricted to MAIN_ADMIN_EMAILS.</text>
  <text x="95" y="878" class="small">Deployment components: R2 Logpush bucket, scheduled Workflow, D1, Access-protected viewer, manual override UI, and CSV export endpoints.</text>
</svg>
